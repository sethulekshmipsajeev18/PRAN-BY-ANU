{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Order</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #ffffff;
            color: #444;
        }

        /* TOP GREEN HEADER */
        .header {
            height: 70px;
            background: #08a653;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .menu {
            font-size: 32px;
            margin-right: 30px;
            cursor: pointer;
        }

        .header h1 {
            font-size: 27px;
            font-weight: 600;
            flex: 1;
        }

        .cancel {
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
        }

        /* ORDER INFORMATION */
        .order-info {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-bottom: 1px solid #eeeeee;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        }

        .info-box {
            text-align: center;
            width: 50%;
        }

        .info-title {
            color: #777;
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 28px;
        }

        .info-value {
            color: #444;
            font-size: 28px;
            font-weight: 500;
        }

        /* TRACKING SECTION */
        .tracking {
            width: 650px;
            max-width: 90%;
            margin: 90px auto 60px;
            position: relative;
        }

        /* VERTICAL LINE */
        .tracking::before {
            content: "";
            position: absolute;
            left: 18px;
            top: 22px;
            bottom: 35px;
            width: 4px;
            background: #eeeeee;
        }

        /* COMPLETED LINE */
        .tracking::after {
            content: "";
            position: absolute;
            left: 18px;
            top: 22px;
            height: 230px;
            width: 4px;
            background: #5cbf9a;
            z-index: 0;
        }

        .status {
            display: flex;
            position: relative;
            min-height: 155px;
            z-index: 1;
        }

        /* DOT */
        .dot {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-right: 35px;
            position: relative;
            z-index: 2;
            background: #dddddd;
        }

        .dot.completed {
            background: #ef2027;
        }

        .dot.current {
            background: #1d5fa7;
        }

        .dot.pending {
            background: #dddddd;
        }

        /* STATUS CONTENT */
        .status-content {
            padding-top: 0;
        }

        .status-content h2 {
            font-size: 25px;
            font-weight: 500;
            color: #444;
            margin-bottom: 14px;
        }

        .status-content p {
            font-size: 17px;
            color: #777;
            line-height: 1.5;
        }

        .status.current-status h2 {
            color: #075a91;
            font-weight: 600;
        }

        .status.pending-status h2 {
            color: #bbbbbb;
        }

        .status.pending-status p {
            color: #cccccc;
        }

        /* ICONS */
        .icon {
            width: 65px;
            height: 55px;
            margin-bottom: 8px;
            display: none;
        }

        /* MOBILE */
        @media (max-width: 600px) {

            .header {
                height: 65px;
                padding: 0 18px;
            }

            .menu {
                font-size: 27px;
                margin-right: 22px;
            }

            .header h1 {
                font-size: 22px;
            }

            .cancel {
                font-size: 14px;
            }

            .order-info {
                height: 150px;
            }

            .info-title {
                font-size: 13px;
                margin-bottom: 20px;
            }

            .info-value {
                font-size: 22px;
            }

            .tracking {
                margin-top: 65px;
                max-width: 92%;
            }

            .tracking::before,
            .tracking::after {
                left: 14px;
                width: 3px;
            }

            .tracking::after {
                height: 225px;
            }

            .status {
                min-height: 145px;
            }

            .dot {
                width: 30px;
                height: 30px;
                margin-right: 25px;
            }

            .status-content h2 {
                font-size: 20px;
                margin-bottom: 10px;
            }

            .status-content p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">

        <div class="menu">
            ☰
        </div>

        <h1>Track Order</h1>

        <div class="cancel">
            CANCEL
        </div>

    </div>


    <!-- ORDER INFORMATION -->
    <div class="order-info">

        <div class="info-box">

            <div class="info-title">
                ESTIMATED TIME
            </div>

            <div class="info-value">
                30 minutes
            </div>

        </div>


        <div class="info-box">

            <div class="info-title">
                ORDER NUMBER
            </div>

            <div class="info-value">
                #2482011
            </div>

        </div>

    </div>


    <!-- ORDER TRACKING -->
    <div class="tracking">

        <!-- ORDER PLACED -->
        <div class="status">

            <div class="dot completed"></div>

            <div class="status-content">

                <h2>Order Placed</h2>

                <p>
                    We have received your order.
                </p>

            </div>

        </div>


        <!-- ORDER CONFIRMED -->
        <div class="status">

            <div class="dot completed"></div>

            <div class="status-content">

                <h2>Order Confirmed</h2>

                <p>
                    Your order has been confirmed.
                </p>

            </div>

        </div>


        <!-- ORDER PROCESSED -->
        <div class="status current-status">

            <div class="dot current"></div>

            <div class="status-content">

                <h2>Order Processed</h2>

                <p>
                    We are preparing your order.
                </p>

            </div>

        </div>


        <!-- READY TO PICKUP -->
        <div class="status pending-status">

            <div class="dot pending"></div>

            <div class="status-content">

                <h2>Ready to Pickup</h2>

                <p>
                    Your order is ready for pickup.
                </p>

            </div>

        </div>

    </div>

</body>
</html>
